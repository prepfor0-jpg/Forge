<style>
:root{--bg:#070708;--card:#111115;--card2:#18181e;--line:#303039;--red:#e5092f;--red2:#ff4664;--muted:#a6a6af;--green:#55e58b;--amber:#ffc44d;--white:#f7f7f8}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#350914 0,transparent 30%),linear-gradient(#070708,#0a0a0d 55%,#070708);color:var(--white);font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding-bottom:82px}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:820px;margin:auto}.top{position:sticky;top:0;z-index:20;background:#08080af2;backdrop-filter:blur(14px);border-bottom:1px solid #24242a;padding:12px 14px}.brand{font-weight:1000;letter-spacing:1.5px;font-size:21px}.brand em{color:var(--red);font-style:normal}.sub{font-size:9px;color:var(--muted);letter-spacing:1px}.content{padding:12px}.hero,.card,.panel{border:1px solid var(--line);border-radius:17px;background:#111115eF;padding:14px;margin:10px 0}.hero{border-color:#651a29;background:linear-gradient(135deg,#270a11,#141419 55%,#0d0d10)}h1{font-size:30px;line-height:1;margin:5px 0 7px}h2{font-size:15px;margin:0 0 10px}h3{font-size:13px}.kicker{font-size:9px;color:#ff7890;font-weight:900;letter-spacing:1.4px}.muted,.tiny{color:var(--muted);font-size:10px}.quote{font-weight:850;font-size:12px;font-style:italic;margin-top:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.between{display:flex;justify-content:space-between;gap:8px;align-items:center}.stat{background:#0f0f13;border:1px solid var(--line);border-radius:12px;padding:10px}.num{font-size:22px;font-weight:1000}.label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}.btn{border:1px solid var(--line);background:#25252c;color:#fff;border-radius:9px;padding:8px 11px;font-weight:850;font-size:11px}.btn.primary{background:var(--red);border-color:var(--red)}.btn.green{background:#10391f;border-color:#286c3d;color:#9bf3b8}.btn.danger{background:#3a1018;border-color:#721c2b;color:#ff9bab}.btn.ghost{background:transparent}.field label{display:block;font-size:9px;color:var(--muted);margin-bottom:4px}.field input,.field select,.field textarea{width:100%;padding:9px;border:1px solid #34343d;border-radius:9px;background:#09090c;color:#fff}.field textarea{min-height:70px}.progress{height:7px;border-radius:99px;background:#292930;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--red2));border-radius:99px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.day{background:#101014;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:8px 2px;font-size:9px;font-weight:900}.day.active{background:#5d0b19;border-color:var(--red);color:#fff}.badge{display:inline-flex;padding:4px 7px;border-radius:99px;background:#27272e;color:#ddd;font-size:9px;font-weight:900}.badge.red{background:#42101b;color:#ff9bac}.badge.green{background:#103a20;color:#94f1b1}.exercise{background:#101014;border:1px solid #303039;border-radius:13px;padding:10px;margin:7px 0}.exercise.main{border-color:#6b1a2a;box-shadow:inset 3px 0 var(--red)}.exname{font-weight:950;font-size:13px}.meta{font-size:9px;color:var(--muted)}.sets{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:7px}.sets input{width:100%;padding:8px 3px;text-align:center;background:#08080a;border:1px solid #303039;color:#fff;border-radius:7px;font-size:10px}.alt{margin-top:7px;padding:7px;background:#19191f;border-radius:8px;font-size:9px;color:#c3c3c9}.alt b{color:#ff738a}.check{font-size:10px;display:flex;gap:5px;align-items:center}.check input{accent-color:var(--red)}.coach{border-left:3px solid var(--red);background:linear-gradient(90deg,#1c0c12,#111115)}.pr{border-left:3px solid var(--amber)}table{width:100%;border-collapse:collapse;font-size:10px}th,td{padding:7px;border-bottom:1px solid var(--line);text-align:left}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#0b0b0df7;border-top:1px solid #292930;padding:7px 7px calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(7,1fr)}.bottom button{border:0;background:transparent;color:#85858e;font-size:8px;font-weight:900}.bottom button.active{color:#fff}.bottom b{display:block;font-size:17px}.timer{text-align:center;font-size:38px;font-weight:1000}.toast{position:fixed;z-index:50;bottom:90px;left:50%;transform:translateX(-50%);background:#f4f4f5;color:#111;padding:9px 13px;border-radius:99px;font-size:10px;font-weight:900;display:none}.spark{height:65px;display:flex;align-items:end;gap:4px}.spark i{flex:1;background:linear-gradient(#ff4967,#5d0b19);border-radius:3px 3px 0 0;min-height:3px}.hidden{display:none!important}@media(max-width:480px){.grid3{grid-template-columns:1fr 1fr 1fr}.grid4{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}h1{font-size:26px}.sets{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="between"><div><div class="brand">FORGE <em>///</em> V3</div><div class="sub">UNLEASHED • PERSONAL TRAINING OS</div></div><span id="weekBadge" class="badge red">W1</span></div></header>
<main id="app" class="content"></main>
<nav class="bottom">
<button data-n="home"><b>⚡</b>Home</button><button data-n="workout"><b>🏋️</b>Train</button><button data-n="history"><b>📈</b>History</button><button data-n="activity"><b>❤️</b>Activity</button><button data-n="body"><b>📏</b>Body</button><button data-n="coach"><b>🧠</b>Coach</button><button data-n="data"><b>💾</b>Data</button>
</nav><div id="toast" class="toast"></div>
</div>
<script>
const KEY='FORGE_PT_V3';
const START='2026-09-24';
const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const PROGRAM={
Monday:{title:'LEGS',focus:'Strength + athletic foundation',q:'Strong legs. Strong base. Stronger you.',e:[
['Back Squat','4 × 5','MAIN • STRENGTH',['Goblet squat','DB front squat','Smith squat']],
['Romanian Deadlift','3 × 8','STRENGTH + THICKNESS',['DB RDL','Good morning']],
['Bulgarian Split Squat','3 × 8/leg','UNILATERAL',['Reverse lunge','Step-up']],
['Leg Curl','3 × 10–12','HYPERTROPHY',['Nordic','Sliding curl','DB hamstring curl']],
['Walking Lunge','2 × 10/leg','ATHLETIC',['Reverse lunge','Static lunge']],
['Calf Raise','4 × 10–15','ACCESSORY',['Single-leg DB calf raise','Seated calf']],
['Farmer Carry','3 × 30–45s','GRIP + TRAPS',['Heavy DB carry','Suitcase carry']]]},
Tuesday:{title:'SHOULDERS + ARMS',focus:'Home-primary hypertrophy + arm size',q:'Build the arms. Build the discipline.',e:[
['DB Shoulder Press','3 × 6–10','MAIN',['Seated DB press']],['Lateral Raise','4 × 12–15','ISOLATION',['Leaning DB raise']],['Rear-Delt Fly','3 × 12–15','ISOLATION',['Incline rear-delt fly']],['DB Curl','3 × 8–10','BICEPS',['Alternating DB curl']],['Incline DB Curl','3 × 10','BICEPS PEAK',['Concentration curl']],['Hammer Curl','2 × 10–12','BRACHIALIS',['Cross-body hammer curl']],['Close-Grip DB Press','3 × 6–8','TRICEPS',['Close-grip push-up','DB floor press']],['DB Overhead Triceps Extension','2 × 12–15','TRICEPS',['One-DB overhead extension']]]},
Thursday:{title:'BACK + BICEPS',focus:'Strength + thickness + V-taper',q:'A thick back is built one clean rep at a time.',e:[
['Deadlift','3 × 4','MAIN • STRENGTH',['Heavy DB RDL','Trap-bar deadlift']],['Pull-ups','4 × 5–8','LATS',['Assisted pull-up','Lat pulldown']],['Barbell Row','3 × 6–8','THICKNESS',['Heavy 1-arm DB row']],['Chest-Supported Row','3 × 8–12','THICKNESS',['Chest-supported DB row']],['Lat Pulldown','2 × 10–12','LATS',['DB pullover','Band pulldown']],['Face Pull','3 × 12–15','REAR DELTS',['Incline rear-delt fly','Band face pull']],['EZ-Bar Curl','3 × 8–10','BICEPS',['DB curl']],['Cable Curl','2 × 12–15','ISOLATION',['Incline DB curl','Concentration curl']]]},
Friday:{title:'ATHLETIC FULL BODY',focus:'Power + strength + conditioning',q:'Train to be useful, powerful and hard to break.',e:[
['Broad / Box Jump','3 × 3','POWER',['Broad jump']],['Front Squat','3 × 5','STRENGTH',['DB front squat','Goblet squat']],['DB Bench Press','3 × 8','UPPER STRENGTH',['Push-up','DB floor press']],['1-Arm DB Row','3 × 8/side','BACK + STABILITY',['Bench-supported DB row']],['KB / DB Swing','3 × 12','POWER',['DB swing','DB RDL']],['Farmer Carry','3 × 40s','GRIP + TRAPS',['Heavy DB farmer carry']],['Sled Push / Intervals','6–8 rounds','CONDITIONING',['30s hard + 90s easy: bike/run/stairs']]]},
Saturday:{title:'CHEST + TRICEPS',focus:'Strength + hypertrophy',q:'Press with intent. Build with patience.',e:[
['Bench Press','4 × 5','MAIN • STRENGTH',['DB bench','Smith press','Machine press']],['Incline DB Press','3 × 8–10','HYPERTROPHY',['Incline push-up','DB press']],['Weighted Dips','3 × 6–10','CHEST + TRICEPS',['Assisted dips','Close-grip push-up']],['Cable Fly','3 × 12–15','ISOLATION',['DB fly','Squeeze press']],['Skull Crusher','3 × 8–10','TRICEPS',['DB skull crusher','DB overhead extension']],['Pushdown','3 × 10–15','ISOLATION',['Band pushdown']],['Overhead Extension','2 × 12–15','ISOLATION',['DB overhead extension']]]},
Wednesday:{title:'RECOVERY',focus:'Mobility + easy movement',q:'Recovery is training you do not skip.',recovery:true},
Sunday:{title:'ZONE 2 + RECOVERY',focus:'Cardiovascular fitness + recovery',q:'Move today. Come back stronger.',recovery:true}
};
const GUIDE={1:'Build the base • RIR 2–3',2:'Build • add a rep or small load when earned',3:'Progress • compounds RIR ~2, isolation RIR 1–2',4:'Push • selected isolation intensity only',5:'Consolidate • quality over failure',6:'Deload + review • reduce load 10–20% OR sets 30–40%, RIR 3–4'};
function fresh(){return {version:3,week:1,day:'Thursday',profile:{name:'',startDate:START,targetWeight:'64–65 kg'},logs:{},activities:{},body:{current:{},weeks:{}},readiness:{},settings:{rest:90}}}
let S=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){return fresh()}})();
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(x){let t=document.getElementById('toast');t.textContent=x;t.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.style.display='none',1500)}
function nav(x){location.hash=x;render()}
document.querySelectorAll('.bottom button').forEach(b=>b.onclick=()=>nav(b.dataset.n));addEventListener('hashchange',render);
function log(){let k=`w${S.week}_${S.day}`;return S.logs[k]??(S.logs[k]={sets:{},rir:{},done:{},notes:''})}
function setDay(d){S.day=d;save();render()} function setWeek(w){S.week=+w;save();render()}
function dayBar(){return `<div class="days">${DAYS.map(d=>`<button class="day ${S.day===d?'active':''}" onclick="setDay('${d}')">${d.slice(0,3)}</button>`).join('')}</div>`}
function weekSel(){return `<select onchange="setWeek(this.value)">${[1,2,3,4,5,6].map(w=>`<option ${w===S.week?'selected':''}>${w}</option>`).join('')}</select>`}
function header(){let p=PROGRAM[S.day];return `<div class="hero"><div class="between"><div><div class="kicker">6-WEEK BLOCK • THU 24 SEP → WED 4 NOV</div><h1>${p.title}</h1><div class="muted">${p.focus}</div></div>${weekSel()}</div><div class="quote">“${p.q}”</div><div style="margin-top:10px"><div class="between tiny"><span>BLOCK PROGRESS</span><span>W${S.week}/6</span></div><div class="progress"><i style="width:${S.week/6*100}%"></i></div></div></div>${dayBar()}`}
function parse(v){let m=String(v||'').match(/(\d+(?:\.\d+)?)\s*[x×]\s*(\d+)/i);return m?{kg:+m[1],reps:+m[2]}:null}
function lifts(){let a=[];Object.entries(S.logs).forEach(([k,l])=>{let d=k.split('_').slice(1).join('_');Object.entries(l.sets||{}).forEach(([i,vs])=>(vs||[]).forEach(v=>{let p=parse(v);if(p&&PROGRAM[d]?.e[i])a.push({exercise:PROGRAM[d].e[i][0],kg:p.kg,reps:p.reps,volume:p.kg*p.reps,rir:+(l.rir?.[i]||99),key:k})}))});return a}
function prMap(){let m={};lifts().forEach(x=>{m[x.exercise]??={weight:0,reps:0,volume:0};m[x.exercise].weight=Math.max(m[x.exercise].weight,x.kg);m[x.exercise].reps=Math.max(m[x.exercise].reps,x.reps);m[x.exercise].volume+=x.volume});return m}
function readiness(){let r=S.readiness[S.week];if(!r)return '—';return Math.round(((+r.sleep+(+r.energy)+(6-+r.soreness)+(6-+r.stress))/20)*100)}
function coach(){let a=lifts(),low=a.filter(x=>x.rir<=1&&x.rir!==99).length,high=a.filter(x=>x.rir>=3&&x.rir!==99).length;if(!a.length)return ['START','Log kg × reps and RIR before changing anything.','red'];if(low>5)return ['FATIGUE','Several sets are at RIR 0–1. Keep compounds away from failure and protect recovery.','red'];if(high>5)return ['PROGRESS','Several sets are at RIR 3+. If reps and technique were clean, a small load increase next exposure is reasonable.','green'];return ['BALANCED','Effort is in a productive range. Repeat or add a small load when the prescribed reps are earned.','red']}
function exercise(e,i,l){let vs=l.sets[i]||['','','',''];let main=e[2].includes('MAIN');return `<div class="exercise ${main?'main':''}"><div class="between"><div><div class="exname">${e[0]}</div><div class="meta">${e[1]} • ${e[2]}</div></div><span class="badge">${main?'MAIN':'WORK'}</span></div><div class="sets">${vs.map((v,j)=>`<input placeholder="kg × reps" value="${esc(v)}" onchange="setSet(${i},${j},this.value)">`).join('')}</div><div class="row" style="margin-top:7px"><label class="check"><input type="checkbox" ${l.done[i]?'checked':''} onchange="setDone(${i},this.checked)"> Done</label><label class="tiny">RIR <input style="width:40px;padding:4px;background:#09090c;border:1px solid #333;color:#fff;border-radius:6px" value="${esc(l.rir[i]||'')}" onchange="setRir(${i},this.value)"></label></div><div class="alt"><b>HOME / ALTERNATIVE:</b> ${e[3].join(' • ')}</div></div>`}
function setSet(i,j,v){let l=log();l.sets[i]??=['','','',''];l.sets[i][j]=v;save()}function setDone(i,v){log().done[i]=v;save()}function setRir(i,v){log().rir[i]=v;save()}
function workout(){let p=PROGRAM[S.day],l=log(),c=coach(),body='';if(p.recovery){body=`<div class="card"><h2>❤️ Recovery / Zone 2</h2><div class="panel">30–60 min easy Zone 2 + 10–15 min mobility. Swimming, walking, cycling, running or another sport all count. Keep it conversational / RPE 3–4.</div><div class="grid2"><div class="field"><label>Duration (min)</label><input value="${esc(l.duration||'')}" onchange="log().duration=this.value;save()"></div><div class="field"><label>RPE</label><input value="${esc(l.rpe||'')}" onchange="log().rpe=this.value;save()"></div></div><div class="row" style="margin-top:8px">${['Zone 2','Swimming','Walking','Cycling','Sport','Mobility'].map(x=>`<button class="btn ${l.activity===x?'primary':''}" onclick="log().activity='${x}';save();render()">${x}</button>`).join('')}</div></div>`}else{body=`<div class="card"><h2>🔥 Warm-up + ramp</h2><div class="tiny">3–5 min easy cardio + dynamic mobility. Main lift: light × 8–10 → ~50% × 5 → ~65% × 3 → ~75–80% × 1–2 → working sets. Later compounds: 1–2 ramp sets. Isolation: normally none.</div></div>${p.e.map((e,i)=>exercise(e,i,l)).join('')}`};document.getElementById('app').innerHTML=header()+`<div class="panel coach"><b>🧠 ${c[0]}</b><div class="tiny">${c[1]}</div></div>${body}<div class="card"><h2>📝 Session</h2><textarea style="width:100%;background:#09090c;color:#fff;border:1px solid #333;border-radius:9px;padding:9px" placeholder="Notes..." onchange="log().notes=this.value;save()">${esc(l.notes||'')}</textarea><div class="row" style="margin-top:8px"><label class="check"><input type="checkbox" ${l.completed?'checked':''} onchange="log().completed=this.checked;save();render()"> Session completed</label><button class="btn danger" onclick="deleteDay()">Clear day</button></div></div>`}
let timer=null,left=90;function timerStart(s){clearInterval(timer);left=s;timer=setInterval(()=>{left--;drawTimer();if(left<=0){clearInterval(timer);navigator.vibrate?.([180,80,180]);toast('REST COMPLETE') }},1000);drawTimer()}function timerStop(){clearInterval(timer);left=90;drawTimer()}function drawTimer(){let e=document.getElementById('timer');if(e)e.textContent=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`}
function deleteDay(){if(confirm('Clear this day?')){delete S.logs[`w${S.week}_${S.day}`];save();render()}}
function home(){let done=DAYS.filter(d=>S.logs[`w${S.week}_${d}`]?.completed).length,p=prMap(),act=(S.activities[S.week]||[]).length;document.getElementById('app').innerHTML=`<div class="hero"><div class="kicker">FORGE PERSONAL TRAINING OS</div><h1>SHOW UP. GET STRONGER.</h1><div class="muted">Strong + muscular + athletic + relatively lean. Log honestly. Let the history drive the next decision.</div><div class="quote">“Progress over perfection. Consistency over intensity you cannot sustain.”</div></div><div class="grid3"><div class="stat"><div class="num">${done}/7</div><div class="label">sessions</div></div><div class="stat"><div class="num">${Object.keys(p).length}</div><div class="label">PR exercises</div></div><div class="stat"><div class="num">${readiness()}</div><div class="label">readiness</div></div></div><div class="card"><div class="between"><h2>⚡ Week ${S.week}</h2><button class="btn primary" onclick="nav('workout')">Train</button></div><div class="progress"><i style="width:${done/7*100}%"></i></div><div class="tiny" style="margin-top:7px">${GUIDE[S.week]}</div></div><div class="card"><h2>📆 Schedule</h2>${DAYS.map(d=>`<div class="between" style="padding:8px 0;border-bottom:1px solid #292930"><span><b>${d}</b><br><span class="tiny">${PROGRAM[d].title}</span></span><span>${S.logs[`w${S.week}_${d}`]?.completed?'✅':'○'}</span></div>`).join('')}</div><div class="panel pr"><div class="between"><b>🏆 PR SNAPSHOT</b><button class="btn" onclick="nav('history')">History</button></div><div class="tiny" style="margin-top:7px">${Object.entries(p).slice(0,3).map(([n,v])=>`${esc(n)}: ${v.weight}kg`).join(' • ')||'Log your first working sets.'}</div></div><div class="panel coach"><b>🧠 COACH</b><div class="tiny">${coach()[1]}</div></div>`}
function history(){let p=prMap(),a=lifts();let rows=Object.entries(p).map(([n,v])=>`<tr><td>${esc(n)}</td><td>${v.weight}kg</td><td>${v.reps}</td><td>${Math.round(v.volume)}</td></tr>`).join('');let bars=DAYS.map(d=>Object.keys(S.logs[`w${S.week}_${d}`]?.sets||{}).length).map(n=>`<i style="height:${Math.min(100,Math.max(4,n*12))}%"></i>`).join('');document.getElementById('app').innerHTML=`<div class="hero"><div class="kicker">HISTORY / PERFORMANCE</div><h1>SEE THE WORK.</h1><div class="muted">Every kg × reps entry becomes history. PRs are weight, rep and accumulated volume signals.</div></div><div class="grid3"><div class="stat"><div class="num">${a.length}</div><div class="label">logged sets</div></div><div class="stat"><div class="num">${Object.keys(p).length}</div><div class="label">exercises</div></div><div class="stat"><div class="num">${readiness()}</div><div class="label">readiness</div></div></div><div class="card"><h2>📊 Set density — W${S.week}</h2><div class="spark">${bars||'<i style="height:3%"></i>'}</div></div><div class="panel pr"><h2>🏆 PERSONAL RECORD BOARD</h2><div style="overflow:auto"><table><tr><th>Exercise</th><th>Best kg</th><th>Best reps</th><th>Volume</th></tr>${rows||'<tr><td colspan="4">No data yet.</td></tr>'}</table></div></div>`}
function activity(){let a=S.activities[S.week]||[];document.getElementById('app').innerHTML=`<div class="hero"><div class="kicker">CARDIO / SPORT / MOVEMENT</div><h1>MOVE OUTSIDE THE GYM.</h1><div class="muted">Swimming, walking, cycling, running, hiking and sports count. Sunday can be an actual activity instead of a “missed workout.”</div></div><div class="card"><h2>➕ Log activity</h2><div class="grid2"><div class="field"><label>Type</label><select id="at"><option>Swimming</option><option>Walking</option><option>Cycling</option><option>Running</option><option>Hiking</option><option>Football</option><option>Basketball</option><option>Yoga / Mobility</option><option>Other</option></select></div><div class="field"><label>Minutes</label><input id="amin"></div><div class="field"><label>Distance km</label><input id="akm"></div><div class="field"><label>RPE 1–10</label><input id="arpe"></div></div><input id="anote" style="width:100%;margin-top:8px;padding:9px;background:#09090c;color:#fff;border:1px solid #333;border-radius:9px" placeholder="Notes"><button class="btn primary" style="margin-top:8px" onclick="addAct()">Add activity</button></div><div class="card"><h2>📋 Week ${S.week}</h2>${a.map((x,i)=>`<div class="panel"><div class="between"><b>${esc(x.type)}</b><button class="btn danger" onclick="delAct(${i})">Delete</button></div><div class="tiny">${x.min||0} min ${x.km?'• '+x.km+' km':''} ${x.rpe?'• RPE '+x.rpe:''}</div><div class="tiny">${esc(x.note||'')}</div></div>`).join('')||'<div class="tiny">Nothing logged yet.</div>'}</div>`}
function addAct(){S.activities[S.week]??=[];S.activities[S.week].push({type:at.value,min:amin.value,km:akm.value,rpe:arpe.value,note:anote.value});save();render()}function delAct(i){S.activities[S.week].splice(i,1);save();render()}
function body(){let c=S.body.current||{},r=S.readiness[S.week]||{};document.getElementById('app').innerHTML=`<div class="hero"><div class="kicker">BODY / CHECKPOINT / READINESS</div><h1>BUILD THE FRAME.</h1><div class="muted">Use consistent conditions for measurements. Track the trend, not day-to-day noise.</div></div><div class="card"><h2>📏 Current</h2><div class="grid2">${[['weight','Weight kg'],['waist','Waist cm'],['chest','Chest cm'],['shoulders','Shoulders cm'],['arms','Upper arm cm'],['thigh','Thigh cm'],['calf','Calf cm'],['hips','Hips cm']].map(([k,n])=>`<div class="field"><label>${n}</label><input value="${esc(c[k]||'')}" onchange="S.body.current['${k}']=this.value;save()"></div>`).join('')}</div></div><div class="panel"><div class="between"><h2>🧠 READINESS</h2><span class="badge red">${readiness()}</span></div><div class="tiny">Sleep + energy: higher is better. Soreness + stress: higher is worse. Use 1–5.</div><div class="grid2" style="margin-top:8px">${[['sleep','Sleep'],['energy','Energy'],['soreness','Soreness'],['stress','Stress']].map(([k,n])=>`<div class="field"><label>${n}</label><input value="${esc(r[k]||'')}" onchange="S.readiness[S.week]??={};S.readiness[S.week]['${k}']=Math.max(1,Math.min(5,+this.value||1));save();render()"></div>`).join('')}</div></div><div class="card"><h2>🎯 Target</h2><div class="grid2"><div class="field"><label>Target weight</label><input value="${esc(S.profile.targetWeight)}" onchange="S.profile.targetWeight=this.value;save()"></div><div class="field"><label>Start date</label><input value="${esc(S.profile.startDate)}" onchange="S.profile.startDate=this.value;save()"></div></div></div><div class="card"><h2>📅 Weekly checkpoint</h2>${[1,2,3,4,5,6].map(w=>{let x=S.body.weeks[w]||{};return `<div class="between" style="padding:8px 0;border-bottom:1px solid #292930"><b>Week ${w}</b><span class="tiny">Weight ${x.weight||'—'} • Waist ${x.waist||'—'}</span><button class="btn" onclick="editBody(${w})">Edit</button></div>`}).join('')}</div>`}
function editBody(w){let b=S.body.weeks[w]||{};let x=prompt('Weight kg',b.weight||'');if(x===null)return;let y=prompt('Waist cm',b.waist||'');if(y===null)return;S.body.weeks[w]={weight:x,waist:y};save();render()}
function coachPage(){let c=coach(),done=DAYS.filter(d=>S.logs[`w${S.week}_${d}`]?.completed).length,mins=(S.activities[S.week]||[]).reduce((a,x)=>a+(+x.min||0),0);document.getElementById('app').innerHTML=`<div class="hero"><div class="kicker">FORGE COACH ENGINE</div><h1>UNLEASHED.</h1><div class="muted">The app suggests from your logs; you decide what to do.</div></div><div class="grid4"><div class="stat"><div class="num">${done}/7</div><div class="label">sessions</div></div><div class="stat"><div class="num">${mins}</div><div class="label">activity min</div></div><div class="stat"><div class="num">${readiness()}</div><div class="label">readiness</div></div><div class="stat"><div class="num">${S.week}/6</div><div class="label">week</div></div></div><div class="panel coach"><span class="badge ${c[2]}">${c[0]}</span><p>${c[1]}</p></div><div class="card"><h2>📌 Week guidance</h2><div class="tiny">${GUIDE[S.week]}</div></div><div class="card"><h2>🏅 Milestones</h2><div class="tiny">${done>=5?'⚡ 5+ sessions this week recorded.':'○ 5 sessions in a week — consistency milestone.'}</div><hr><div class="tiny">${Object.keys(prMap()).length>=3?'🏆 PR data exists across 3+ exercises.':'○ Log 3 exercises with kg × reps to build the PR board.'}</div><hr><div class="tiny">${mins>=120?'❤️ 120+ activity minutes recorded.':'○ 120 activity minutes across a week.'}</div></div>`}
function data(){document.getElementById('app').innerHTML=`<div class="hero"><div class="kicker">DATA / BACKUP</div><h1>YOUR DATA. YOUR PROGRESS.</h1><div class="muted">Local-first. Export a JSON backup at the end of every week and send it back here for review.</div></div><div class="card"><h2>👤 Profile</h2><div class="grid2"><div class="field"><label>Name</label><input value="${esc(S.profile.name)}" onchange="S.profile.name=this.value;save()"></div><div class="field"><label>Start date</label><input value="${esc(S.profile.startDate)}" onchange="S.profile.startDate=this.value;save()"></div></div></div><div class="card"><h2>💾 Backup</h2><div class="row"><button class="btn primary" onclick="exportJSON()">Export JSON</button><button class="btn" onclick="document.getElementById('imp').click()">Import JSON</button><input id="imp" class="hidden" type="file" accept=".json" onchange="importJSON(this.files[0])"></div></div><div class="card"><h2>⚙️ Rest timer</h2><input value="${S.settings.rest}" onchange="S.settings.rest=+this.value||90;save()"></div><div class="card"><h2>🧹 Reset</h2><button class="btn danger" onclick="if(confirm('Delete all local FORGE data?')){S=fresh();save();render()}">Delete local data</button></div>`}
function exportJSON(){let blob=new Blob([JSON.stringify({app:'FORGE V3 UNLEASHED',exportedAt:new Date().toISOString(),data:S},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`forge-v3-week-${S.week}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);toast('JSON exported')}
function importJSON(f){if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);S=x.data||x;save();render();toast('Imported')}catch(e){toast('Invalid JSON')}};r.readAsText(f)}
function render(){document.getElementById('weekBadge').textContent='W'+S.week;let p=location.hash.slice(1)||'home';document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('active',b.dataset.n===p));({home,workout,history,activity,body,coach:coachPage,data}[p]||home)()}
render();
if(location.protocol!=='file:'&&'serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body></html>
